<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Hong Kong university inspired campus scene</title>
  <desc id="desc">An original cinematic campus scene with brick academic buildings, green hillside, warm windows, and Hong Kong harbor light.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#062a23"/>
      <stop offset="0.48" stop-color="#123d32"/>
      <stop offset="1" stop-color="#0b1715"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#9d2235"/>
      <stop offset="0.48" stop-color="#6f1625"/>
      <stop offset="1" stop-color="#361119"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f0e2c2"/>
      <stop offset="1" stop-color="#a98952"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f9f0cf" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#d5a947" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="harbor" cx="70%" cy="20%" r="65%">
      <stop offset="0" stop-color="#e5c069" stop-opacity="0.42"/>
      <stop offset="0.38" stop-color="#9d2235" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#002f26" stop-opacity="0"/>
    </radialGradient>
    <filter id="softNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
      <feBlend mode="soft-light" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#sky)"/>
  <rect width="1200" height="1500" fill="url(#harbor)"/>

  <g opacity="0.22">
    <path d="M0 430 C190 330 340 370 510 280 C710 170 890 205 1200 76 L1200 515 C915 442 720 496 552 426 C360 346 214 460 0 520Z" fill="#0f5a48"/>
    <path d="M0 600 C210 520 365 560 575 480 C790 398 985 460 1200 350 L1200 730 L0 730Z" fill="#0b473b"/>
  </g>

  <g opacity="0.5">
    <rect x="0" y="1030" width="1200" height="470" fill="#06110f"/>
    <path d="M0 1035 C245 960 422 1048 620 972 C820 896 1004 955 1200 884 L1200 1130 L0 1130Z" fill="#0a3d34"/>
  </g>

  <g transform="translate(110 405)">
    <path d="M90 295 L490 86 L890 295 Z" fill="url(#stone)" opacity="0.95"/>
    <path d="M128 285 L490 112 L852 285 Z" fill="#6b4b2b" opacity="0.45"/>
    <rect x="0" y="295" width="980" height="305" rx="8" fill="url(#brick)"/>
    <rect x="32" y="320" width="916" height="250" rx="4" fill="#7e1d2d" opacity="0.62"/>
    <rect x="356" y="70" width="268" height="520" rx="6" fill="url(#brick)"/>
    <rect x="384" y="96" width="212" height="468" rx="4" fill="#6c1828"/>
    <rect x="420" y="134" width="140" height="258" rx="4" fill="url(#glass)" opacity="0.7"/>

    <g fill="url(#stone)">
      <rect x="120" y="278" width="70" height="340"/>
      <rect x="286" y="278" width="70" height="340"/>
      <rect x="624" y="278" width="70" height="340"/>
      <rect x="790" y="278" width="70" height="340"/>
    </g>

    <g fill="#ead8ad" opacity="0.92">
      <rect x="91" y="640" width="798" height="34"/>
      <rect x="132" y="692" width="716" height="28"/>
      <rect x="176" y="742" width="628" height="24"/>
    </g>

    <g fill="#f4ce73" opacity="0.75">
      <rect x="60" y="345" width="58" height="54" rx="3"/>
      <rect x="210" y="345" width="58" height="54" rx="3"/>
      <rect x="712" y="345" width="58" height="54" rx="3"/>
      <rect x="862" y="345" width="58" height="54" rx="3"/>
      <rect x="60" y="450" width="58" height="54" rx="3"/>
      <rect x="210" y="450" width="58" height="54" rx="3"/>
      <rect x="712" y="450" width="58" height="54" rx="3"/>
      <rect x="862" y="450" width="58" height="54" rx="3"/>
    </g>
  </g>

  <g opacity="0.38">
    <rect x="78" y="1040" width="1044" height="2" fill="#e0bd66"/>
    <rect x="185" y="1118" width="830" height="2" fill="#e0bd66"/>
    <rect x="274" y="1194" width="652" height="2" fill="#e0bd66"/>
  </g>

  <g opacity="0.4">
    <circle cx="146" cy="930" r="68" fill="#123f34"/>
    <circle cx="1010" cy="932" r="82" fill="#123f34"/>
    <circle cx="1060" cy="1010" r="46" fill="#0b3129"/>
  </g>

  <rect width="1200" height="1500" fill="none" filter="url(#softNoise)" opacity="0.28"/>
  <rect width="1200" height="1500" fill="url(#sky)" opacity="0.08"/>
</svg>
